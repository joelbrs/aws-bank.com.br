spring:
  application:
    name: ms-transaction

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

http:
  client:
    authorizer:
      url: https://util.devi.tools
      path: /api/v2

server:
  servlet:
    context-path: /ms-transaction
  port: 8080
  address: ${SERVER_ADDRESS:0.0.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  show-actuator: true